<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="CIFRA — controle de gastos pessoais, local e privado." />
    <title>CIFRA — Controle financeiro</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312a150'/%3E%3Cpath d='M16 7.5v17M20.2 12.2c0-1.6-1.9-2.9-4.2-2.9s-4.2 1.3-4.2 2.9c0 4 8.4 2.4 8.4 6.4 0 1.6-1.9 2.9-4.2 2.9s-4.2-1.3-4.2-2.9' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // Aplica o tema salvo antes da primeira pintura, evitando o "flash" branco.
      (function () {
        try {
          var stored = localStorage.getItem('cifra.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          /* localStorage indisponível: segue no tema claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
